<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبطال النصر: رحلة استعادة السيادة - 6 أكتوبر 1973</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        egyptRed: '#ce1126',
                        egyptGold: '#c09a3e',
                        egyptBlack: '#111111',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; overflow-x: hidden; }
        .military-grid {
            background-image: linear-gradient(to right, rgba(192, 154, 62, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(192, 154, 62, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .gold-border { border: 2px solid #c09a3e; box-shadow: 0 0 15px rgba(192, 154, 62, 0.3); }
        .gold-glow { text-shadow: 0 0 10px rgba(192, 154, 62, 0.6); }
        @media print {
            body * { visibility: hidden; }
            #certificate-modal, #certificate-modal * { visibility: visible; }
            #certificate-modal { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: white !important; color: black !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="military-grid min-h-screen flex flex-col justify-between selection:bg-egyptRed selection:text-white">

    <!-- Top Header Navigation -->
    <header class="w-full bg-slate-900/90 border-b-2 border-egyptGold/40 backdrop-blur-md p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full bg-egyptRed flex items-center justify-center font-bold text-white shadow-lg border border-egyptGold">
                    1973
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-egyptGold tracking-wide">أبطال النصر</h1>
                    <p class="text-xs text-gray-400">مسابقة 6 أكتوبر بعيون رقمية</p>
                </div>
            </div>

            <!-- Header Stats -->
            <div id="header-stats" class="hidden flex items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-egyptGold"></i>
                    <span id="player-display-name" class="font-bold text-slate-200 text-sm">البطل</span>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <span id="score-display" class="font-black text-egyptGold">0</span>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-flag-checkered text-egyptRed"></i>
                    <span id="stage-display" class="font-bold text-slate-200 text-sm">1 / 3</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-grow flex items-center justify-center">

        <!-- SCREEN 0: OFFICIAL COVER PAGE -->
        <div id="screen-cover" class="w-full bg-slate-900/95 gold-border rounded-2xl p-6 md:p-8 text-center relative shadow-2xl">
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-egyptRed/20 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-egyptGold/20 rounded-full blur-2xl"></div>

            <!-- Official Logo -->
            <div class="flex justify-center mb-4">
                <img src="https://i.ibb.co/6R22h32/logo.jpg" alt="شعار التوجيه العام" class="w-28 h-28 md:w-32 md:h-32 rounded-full border-4 border-egyptGold shadow-xl object-cover bg-white" onerror="this.src='https://via.placeholder.com/120?text=Logo'">
            </div>

            <!-- Official Directorate Info -->
            <div class="mb-6 space-y-1">
                <p class="text-xs md:text-sm font-bold text-egyptGold">محافظة الغربية - وزارة التربية والتعليم والتعليم الفني</p>
                <h3 class="text-lg md:text-xl font-black text-white">مديرية التربية والتعليم بالغربية</h3>
                <p class="text-xs md:text-sm text-gray-300">التوجيه العام لمادة الكمبيوتر وتكنولوجيا المعلومات - وحدة البرمجة والتدريب</p>
            </div>

            <hr class="border-slate-700 my-4">

            <h2 class="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-egyptRed via-yellow-400 to-egyptGold mb-2 gold-glow">
                مسابقة 6 أكتوبر بعيون رقمية
            </h2>
            <p class="text-sm md:text-base text-egyptGold font-bold mb-6">(البرمجة والذكاء الاصطناعي)</p>

            <!-- Student & School Credentials Box -->
            <div class="bg-slate-800/90 border-2 border-egyptGold/60 p-5 rounded-xl max-w-lg mx-auto mb-8 shadow-inner text-right">
                <div class="mb-3 border-b border-slate-700 pb-2">
